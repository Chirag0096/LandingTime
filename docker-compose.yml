version: '3.8'

services:
  landing-time:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landing-time-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - landing-time-data:/app/data

volumes:
  landing-time-data:
